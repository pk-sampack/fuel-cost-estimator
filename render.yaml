# Render Blueprint: NestJS API on Render, Postgres on Supabase.
# Deploy: https://render.com/deploy?repo=https://github.com/pk-sampack/fuel-cost-estimator
#
# Before applying, have your Supabase connection string ready:
#   Supabase -> Project Settings -> Database -> Connection string -> Session pooler
#   postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
# Paste it when Render asks for DATABASE_URL (it is stored as a secret, not in this file).

services:
  - type: web
    name: fuel-cost-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build -w @fce/contracts && npm run build -w @fce/engine && npm run build -w @fce/api
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DRIVER
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ORIGIN
        value: https://fuel-cost-estimator-web.vercel.app
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FUEL_SYNC_ENABLED
        value: 'true'
